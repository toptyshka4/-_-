<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Система управления вагонным парком</title>

  <!-- Базовые стили вашей страницы (если есть). Можно удалить строку ниже, если не используете. -->
  <link rel="stylesheet" href="./assets/css/site.css">

  <!-- Стили UI-модуля (картинка вагона, тултипы и пр.) -->
  <link rel="stylesheet" href="./wagon.module.css" />

  <style>
    /* Небольшая сетка/оформление демо — необязательно */
    body { margin:0; background:#f8fafc; color:#0f172a; font: 16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif; }
    .titlebar { padding:16px 24px; background:#0ea5e9; color:#fff; font-weight:700; }
    .note { max-width:1100px; margin:8px auto 0; padding:0 24px; color:#64748b; }
    .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:16px; padding:24px; max-width:1100px; margin:0 auto; }
    .wagon { background:#fff; border:1px solid #e5e7eb; border-radius:12px; padding:12px; min-height:120px; display:flex; align-items:center; justify-content:center; }
  </style>
</head>
<body>
  <div class="titlebar">Система управления вагонным парком</div>
  <div class="note">
    Откройте DevTools → Network: запрос к <code>./data/wagons_2000.json</code> должен быть 200 OK.
  </div>

  <!--
    Примеры элементов. В вашем реальном UI их может быть больше,
    главное — указывать data-number с номером из базы.
    Для инверсии используйте: data-side="invert" или data-flip="1" или data-inverted="1" или data-working-side="right".
    Также поддерживаются классы: is-inverted, flip-h
  -->
  <div class="grid">
    <div class="wagon" data-number="00113522"></div>
    <div class="wagon" data-number="00113522" data-side="invert"></div>

    <!-- Добавьте свои реальные номера -->
    <div class="wagon" data-number="00113523"></div>
    <div class="wagon" data-number="00113524" data-flip="1"></div>
  </div>

  <noscript>Для работы этой страницы требуется JavaScript.</noscript>

  <!-- Подключение вашего модуля (важно: относительный путь ./) -->
  <script src="./wagon.module.js"></script>

  <script>
    // Инициализация модуля. Пути — строго относительные (./...), чтобы на GitHub Pages не было 404.
    WagonUI.init({
      dataUrl: './data/wagons_2000.json',          // база с данными (относительный путь)
      youngYear: 2018,
      cellSelector: '.wagon, [data-number]',
      typeToAsset: {                                // соответствие "тип → картинка"
        'одноэтажный': './assets/wagon_single.jpg',
        'двухэтажный': './assets/wagon_double.jpg'
      },
      debug: false
    });
  </script>
</body>
</html>
